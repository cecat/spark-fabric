# Sibline NATS broker — spark-960b (Phase 7). Loopback-only, JetStream, 3 users.
#
# Adapted from Sibline/broker/nats-server.conf (pin cab044f). Deliberate deltas:
#   - LOOPBACK bind (127.0.0.1), not tailnet. The plan scopes Sibline local-only;
#     nothing is exposed off-box. Gandalf reaches it via a host-side file bridge
#     (Phase 8b), so the sandbox never needs raw NATS.
#   - Every runtime value comes from the ENVIRONMENT ($VAR), injected by the
#     systemd unit from ~/.config/sibline/cred + the unit's own Environment=
#     lines. This file has NO secrets and NO machine-specific paths, so it is
#     safe to commit. (nats-server expands $VAR in strings, paths, and passwords
#     — verified.)
#   - Our agent names: gandalf, luoji (not Rick's kukla, ollie).

listen: "127.0.0.1:4222"
http:   "127.0.0.1:8222"
server_name: "sibline-broker"

jetstream {
  store_dir: $SIBLINE_STORE_DIR         # -> $HOME/.sibline/jetstream
  max_memory_store: 256MB
  max_file_store: 2GB
}

authorization {
  users = [
    { user: admin
      password: $NATS_ADMIN_PASS
      permissions: { publish: ">", subscribe: ">" } }

    { user: gandalf
      password: $GANDALF_NATS_PASS
      # $JS.> is LOAD-BEARING: without it JetStream consumer/ack ops fail with
      # "permission denied" even though sibline.> pub/sub works. The error points
      # at subscribe while the missing grant is on the ack-publish path.
      permissions: {
        publish:   { allow: ["sibline.>", "_INBOX.>", "$JS.>"] }
        subscribe: { allow: ["sibline.>", "_INBOX.>"] } } }

    { user: luoji
      password: $LUOJI_NATS_PASS
      permissions: {
        publish:   { allow: ["sibline.>", "_INBOX.>", "$JS.>"] }
        subscribe: { allow: ["sibline.>", "_INBOX.>"] } } }
  ]
}

log_file: $SIBLINE_LOG_FILE             # -> $HOME/.sibline/logs/nats.log
logtime: true
debug: false
trace: false
